<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hypercube — 3D landing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #FE0100; --blue: #0000FF; --yellow: #FFCC00; --black: #1D1D1B; --ink: #333;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fff; color: var(--ink); font-family: 'IBM Plex Sans', system-ui, sans-serif; overflow: hidden; }

  /* Site header (same proportions as hypercube.nl) */
  header { position: fixed; inset: 0 0 auto 0; height: 110px; display: flex; align-items: center; justify-content: center; z-index: 10; pointer-events: none; }
  header img { height: 56px; pointer-events: auto; }
  header .meta { position: absolute; right: 40px; display: flex; gap: 22px; align-items: center; font-size: 14px; pointer-events: auto; }
  header .meta b { font-weight: 600; font-size: 16px; margin-left: 18px; }

  #stage { position: fixed; inset: 0; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  #stage.over-portal { cursor: pointer; }
  canvas { display: block; touch-action: none; }

  /* The section names are drawn on the cube's faces (3D text). These links are the accessible navigation:
     visually hidden, reachable with Tab, and focusing one turns its face to the viewer. */
  .label {
    position: fixed; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;
  }
  .label:focus-visible { clip-path: none; width: auto; height: auto; left: 16px; top: 16px; z-index: 30; padding: 6px 10px;
    background: #fff; color: var(--c); font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: .12em; outline: 2px solid var(--c); }

  /* Bottom dock: hint line + one pill per page */
  .dock {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 15;
    display: flex; flex-direction: column; align-items: center; gap: 16px; width: max-content; max-width: calc(100% - 32px);
  }
  .hint {
    margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 15px; letter-spacing: .2em; text-transform: uppercase; color: #7a7a7a;
    transition: opacity .4s; pointer-events: none; text-align: center; white-space: nowrap;
  }
  .pills { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .pill {
    --c: var(--ink);
    display: inline-flex; align-items: center; gap: .6em; padding: .7em 1.35em; border-radius: 999px;
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; text-decoration: none;
    color: var(--c); background: rgba(255, 255, 255, .9); border: 1.5px solid var(--c);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); outline: none; cursor: pointer;
    transition: background-color .25s, color .25s, opacity .3s, transform .25s cubic-bezier(.2, .8, .2, 1);
  }
  .pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill:hover, .pill:focus-visible, .pill.on { background: var(--c); color: #fff; }
  .pill:active { transform: scale(.96); }
  .pills.has-on .pill:not(.on) { opacity: .35; }                      /* same dimming rule as the cube */
  .pill.go::after { content: '→'; margin-left: .1em; }
  .hint.hide { opacity: 0; }

  @media (max-width: 700px) { header .meta { display: none; } header img { height: 40px; } .dock { bottom: 22px; gap: 12px; } .hint { font-size: 12px; letter-spacing: .14em; white-space: normal; line-height: 1.7; } .pills { gap: 6px; flex-wrap: nowrap; } .pill { font-size: 10.5px; padding: .7em .9em; letter-spacing: .06em; gap: .45em; white-space: nowrap; } .pill::before { width: 6px; height: 6px; } }
  /* embedded in the home page: the site's own header sits above, so hide this page's mock header */
  .embed header { display: none; }
  /* embedded: vertical swipes scroll the page; horizontal drags still turn the cube */
  .embed canvas { touch-action: pan-y; }
</style>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    if (q.has('embed')) document.documentElement.classList.add('embed');
    if (q.get('lang') === 'en') document.documentElement.lang = 'en';
  })();
</script>

<script>
  (function () {
    if (document.documentElement.lang !== 'en') return;
    var T = {
      sport: { href: '../../en/sports/', label: 'Sports', pill: 'Sports' },
      mobiliteit: { href: '../../en/mobility/', label: 'Mobility', pill: 'Mobility' },
      over: { href: '../../en/about-hypercube/', label: 'About Hypercube', pill: 'About Hypercube' }
    };
    Object.keys(T).forEach(function (k) {
      var l = document.querySelector('.label[data-portal="' + k + '"]'), p = document.querySelector('.pill[data-portal="' + k + '"]');
      if (l) { l.href = T[k].href; l.textContent = T[k].label; }
      if (p) { p.href = T[k].href; p.textContent = T[k].pill; }
    });
    var h = document.getElementById('hint'); if (h) h.textContent = 'Turn the cube or choose a page';
    var nav = document.getElementById('pills'); if (nav) nav.setAttribute('aria-label', 'Pages');
  })();

<script type="module">
import * as THREE from 'three';
import CameraControls from 'camera-controls';
import { Text } from 'troika-three-text';

CameraControls.install({ THREE });

/* ==================================================================
   GEOMETRY
   The Hypercube logo is a projection of a 4D tesseract:
   16 vertices (±1)^4, 32 edges, one colour per 4D axis.
     x → red   y → blue   z → yellow   w → black (the 4th dimension)
   BASIS maps 4D → 3D; head-on it reproduces the logo, in 3D it has depth.
   Strokes are 3D tubes ending exactly on their vertices; every vertex gets a camera-facing joint disc
   whose colour is a rule (red at rest, the open page's colour while a page is open), not a depth accident.
   Everything is unlit (flat brand colours): the 3D is in the geometry and the camera, not in shading.
   ================================================================== */
const C = 0.59, D = 0.82;
const R = 0.066;                         // stroke radius (world units)
const BASIS = [
  new THREE.Vector3(1, 0, 0),
  new THREE.Vector3(0, 1, 0),
  new THREE.Vector3(C, C, -D),
  new THREE.Vector3(C, -C, D),
];
const HEX = ['#FE0100', '#0000FF', '#FFCC00', '#1D1D1B'];
const AXIS_COLORS = HEX.map(h => new THREE.Color(h));
const DIM = 0.08;
const EN = document.documentElement.lang === 'en';

const PORTALS = [
  // One square face of the tesseract each (two varying 4D axes, two fixed).
  // `rest` = the 4D rotation that turns that face into a true square.
  { key: 'sport',      axis: 0, span: [0, 2], fixed: [[1,  1], [3,  1]], rest: { yz: Math.PI / 2 },
    title: EN ? 'SPORTS' : 'SPORT', sub: EN ? 'Explore sports' : 'Ontdek sport' },
  { key: 'mobiliteit', axis: 1, span: [1, 3], fixed: [[0, -1], [2, -1]], rest: { xw: Math.PI / 2 },
    title: EN ? 'MOBILITY' : 'MOBILITEIT', sub: EN ? 'Explore mobility' : 'Ontdek mobiliteit' },
  { key: 'over',       axis: 3, span: [0, 1], fixed: [[2,  1], [3, -1]], rest: {},
    title: EN ? 'ABOUT\nHYPERCUBE' : 'OVER\nHYPERCUBE', sub: EN ? 'Who we are' : 'Wie we zijn' },
];
const PLANES = { yz: [1, 2], xw: [0, 3], zw: [2, 3] };
const ANGLE_KEYS = ['yz', 'xw', 'zw'];

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const embedded = document.documentElement.classList.contains('embed');

/* ---------------- springs (critically damped, frame-rate independent) ---------------- */
const cur = {}, vel = {}, goal = {};
function def(key, v) { cur[key] = goal[key] = v; vel[key] = 0; }
function spring(key, omega, dt) {
  const x = cur[key] - goal[key], v = vel[key];
  const e = Math.exp(-omega * dt), tmp = (v + omega * x) * dt;
  cur[key] = goal[key] + (x + tmp) * e;
  vel[key] = (v - omega * tmp) * e;
}
ANGLE_KEYS.forEach(k => def(k, 0));
def('speed', 0);
[0, 1, 2, 3].forEach(b => def('op' + b, 1));
PORTALS.forEach(p => { def('hl_' + p.key, 0); def('dot_' + p.key, 0); def('lb_' + p.key, 0); });
['jr', 'jg', 'jb'].forEach((k, i) => def(k, AXIS_COLORS[0].toArray()[i]));
const OMEGA = { ang: 4.6, op: 11, hl: 9, joint: 10, speed: 2.2, label: 9, turn: 4.2 };

/* ---------------- renderer / scene / camera ---------------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0xffffff, 1);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xffffff, 12, 22);       // far strokes soften into the white: depth cue
const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 100);
const group = new THREE.Group();                   // the cube: turned as a whole to face a page to the viewer
scene.add(group);

/* Orbit camera (camera-controls): drag to orbit with damping; eased moves when a page opens.
   Embedded in the home page the wheel and two-finger gestures stay with the page (scrolling). */
const controls = new CameraControls(camera, renderer.domElement);
controls.smoothTime = 0.42; controls.draggingSmoothTime = 0.12;
controls.azimuthRotateSpeed = 0.9; controls.polarRotateSpeed = 0.7;
controls.minPolarAngle = Math.PI * 0.18; controls.maxPolarAngle = Math.PI * 0.82;
controls.minDistance = 7; controls.maxDistance = 24;
controls.mouseButtons.right = CameraControls.ACTION.NONE;
controls.mouseButtons.middle = CameraControls.ACTION.NONE;
controls.mouseButtons.wheel = embedded ? CameraControls.ACTION.NONE : CameraControls.ACTION.DOLLY;
controls.touches.one = CameraControls.ACTION.TOUCH_ROTATE;
controls.touches.two = embedded ? CameraControls.ACTION.NONE : CameraControls.ACTION.TOUCH_DOLLY;
controls.touches.three = CameraControls.ACTION.NONE;

/* ---------------- tesseract ---------------- */
const V4 = Array.from({ length: 16 }, (_, i) => [0, 1, 2, 3].map(b => ((i >> b) & 1 ? 1 : -1)));
const EDGES = [[], [], [], []];
for (let i = 0; i < 16; i++) for (let b = 0; b < 4; b++) if (!((i >> b) & 1)) EDGES[b].push([i, i | (1 << b)]);

let wobble = 0;
const _s = [0, 0, 0, 0];
function project4(s, ang, out, withWobble) {
  _s[0] = s[0]; _s[1] = s[1]; _s[2] = s[2]; _s[3] = s[3];
  for (const k of ANGLE_KEYS) {
    const a = ang[k] + (withWobble && k === 'xw' ? wobble : 0);
    if (!a) continue;
    const [i, j] = PLANES[k], c = Math.cos(a), sn = Math.sin(a);
    const u = _s[i] * c - _s[j] * sn, v = _s[i] * sn + _s[j] * c;
    _s[i] = u; _s[j] = v;
  }
  return out.set(0, 0, 0)
    .addScaledVector(BASIS[0], _s[0]).addScaledVector(BASIS[1], _s[1])
    .addScaledVector(BASIS[2], _s[2]).addScaledVector(BASIS[3], _s[3]);
}

const tubeGeo = new THREE.CylinderGeometry(1, 1, 1, 32, 1, true);
const ballGeo = new THREE.SphereGeometry(1, 32, 20);
const discGeo = new THREE.CircleGeometry(1, 48);
const ZAX = new THREE.Vector3(0, 0, 1), camLocal = new THREE.Vector3();
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _sc = new THREE.Vector3(), _mid = new THREE.Vector3();
const _a = new THREE.Vector3(), _b = new THREE.Vector3(), _d = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0);
function setTube(mesh, k, a, b, r) {
  _d.subVectors(b, a); const len = _d.length() || 1e-6;
  _mid.addVectors(a, b).multiplyScalar(0.5);
  _q.setFromUnitVectors(UP, _d.multiplyScalar(1 / len));
  mesh.setMatrixAt(k, _m.compose(_mid, _q, _sc.set(r, len, r)));
}
function setJoint(mesh, k, p, r) {
  _d.subVectors(camLocal, p).normalize();
  _mid.copy(p).addScaledVector(_d, r * 1.08);
  _q.setFromUnitVectors(ZAX, _d);
  mesh.setMatrixAt(k, _m.compose(_mid, _q, _sc.set(r, r, 1)));
}

const P = Array.from({ length: 16 }, () => new THREE.Vector3());
const tubes = AXIS_COLORS.map(col => {
  const m = new THREE.InstancedMesh(tubeGeo, new THREE.MeshBasicMaterial({ color: col }), 8);
  m.frustumCulled = false; group.add(m); return m;
});
const jointMat = new THREE.MeshBasicMaterial({ color: AXIS_COLORS[0].clone() });
const joints = new THREE.InstancedMesh(discGeo, jointMat, 16);
joints.frustumCulled = false; joints.renderOrder = 3; group.add(joints);

/* ---------------- faces, their labels ---------------- */
const FONT_TITLE = 'https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5.0.13/files/ibm-plex-mono-latin-400-normal.woff';
const FONT_SUB = 'https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5.0.13/files/ibm-plex-sans-latin-600-normal.woff';
const CORNERS = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
const hitTargets = [];
const centerOf = new THREE.Vector3();

for (const p of PORTALS) {
  p.color = AXIS_COLORS[p.axis];
  p.v4 = CORNERS.map(([a, b]) => { const s = [0, 0, 0, 0]; s[p.span[0]] = a; s[p.span[1]] = b; p.fixed.forEach(([ax, v]) => (s[ax] = v)); return s; });
  p.pts = p.v4.map(() => new THREE.Vector3());
  p.center = new THREE.Vector3(); p.normal = new THREE.Vector3(); p.u = new THREE.Vector3(); p.v = new THREE.Vector3();
  p.link = document.querySelector(`.label[data-portal="${p.key}"]`);
  p.pill = document.querySelector(`.pill[data-portal="${p.key}"]`);

  // invisible quad = hover/click area
  const qg = new THREE.BufferGeometry();
  qg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(12), 3));
  qg.setIndex([0, 1, 2, 0, 2, 3]);
  p.hit = new THREE.Mesh(qg, new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide }));
  p.hit.userData.portal = p; p.hit.frustumCulled = false;
  group.add(p.hit); hitTargets.push(p.hit);

  // highlight of the open face: a slightly fatter sheath around its 4 edges
  p.hlMat = new THREE.MeshBasicMaterial({ color: p.color, transparent: true, opacity: 0, depthWrite: false });
  p.hlTubes = new THREE.InstancedMesh(tubeGeo, p.hlMat, 4);
  p.hlBalls = new THREE.InstancedMesh(discGeo, p.hlMat, 4);
  [p.hlTubes, p.hlBalls].forEach(m => { m.frustumCulled = false; m.renderOrder = 4; m.visible = false; group.add(m); });

  // pulsing marker at the face centre: affordance + extra hit area
  p.dotMat = new THREE.MeshBasicMaterial({ color: p.color, transparent: true, opacity: 0, depthWrite: false });
  p.dot = new THREE.Mesh(ballGeo, p.dotMat);
  const dotHit = new THREE.Mesh(new THREE.SphereGeometry(0.34 / 0.075, 10, 8), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
  dotHit.userData.portal = p; p.dot.add(dotHit); hitTargets.push(dotHit);
  group.add(p.dot);

  /* The label is a child of the face: an anchor that sits on the face's centre with its axes on the face
     (x along one edge, y along the other, z = the face's OUTWARD normal), so it moves, turns and tilts with
     the face and reads from the outside of the cube. Flat vector look: unlit, solid colours, no shading,
     drawn over the bars (no depth test) so the name always reads like printed type. */
  p.anchor = new THREE.Group(); p.anchor.visible = false; group.add(p.anchor);
  p.plateMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false, depthTest: false, side: THREE.FrontSide });
  p.plate = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), p.plateMat);
  p.plate.position.z = R * 1.35; p.plate.renderOrder = 5; p.anchor.add(p.plate);

  p.titleText = new Text();
  Object.assign(p.titleText, { text: p.title, font: FONT_TITLE, fontSize: 0.2, letterSpacing: 0.16, lineHeight: 1.12,
    textAlign: 'center', anchorX: 'center', anchorY: 'bottom', color: p.color, depthOffset: -1 });
  p.subText = new Text();
  Object.assign(p.subText, { text: p.sub, font: FONT_SUB, fontSize: 0.085, letterSpacing: 0.02,
    anchorX: 'center', anchorY: 'top', color: 0x333333, depthOffset: -1 });
  for (const t of [p.titleText, p.subText]) {
    t.material = new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, depthTest: false, side: THREE.FrontSide });
    t.position.z = R * 1.45; t.renderOrder = 6; t.fillOpacity = 0; t.sync(); p.anchor.add(t);
  }
  p.titleText.position.y = 0.02; p.subText.position.y = -0.07;
}

// Face corners, centre, in-plane axes and OUTWARD normal (pointing away from the cube's centre).
function faceFor(ang, p, ptsOut, centerOut, normalOut, uOut, vOut, withWobble) {
  p.v4.forEach((s, i) => project4(s, ang, ptsOut[i], withWobble));
  centerOut.set(0, 0, 0); ptsOut.forEach(v => centerOut.add(v)); centerOut.multiplyScalar(0.25);
  uOut.subVectors(ptsOut[1], ptsOut[0]).normalize();
  vOut.subVectors(ptsOut[3], ptsOut[0]);
  normalOut.crossVectors(uOut, vOut).normalize();
  if (normalOut.dot(centerOut) < 0) { normalOut.negate(); uOut.negate(); }   // keep x, y, z right-handed with z outward
  vOut.crossVectors(normalOut, uOut).normalize();                              // y in the face plane, square to x
}

let active = null;
const _basis = new THREE.Matrix4();
function updateGeometry(t) {
  for (let i = 0; i < 16; i++) project4(V4[i], cur, P[i], true);
  for (let b = 0; b < 4; b++) {
    EDGES[b].forEach(([i, j], k) => setTube(tubes[b], k, P[i], P[j], R));
    tubes[b].instanceMatrix.needsUpdate = true;
  }
  for (let i = 0; i < 16; i++) setJoint(joints, i, P[i], R);
  joints.instanceMatrix.needsUpdate = true;

  for (const p of PORTALS) {
    faceFor(cur, p, p.pts, p.center, p.normal, p.u, p.v, true);
    const pos = p.hit.geometry.attributes.position;
    const grow = p === active ? 1.75 : 1.12;
    p.pts.forEach((v, i) => { _b.copy(v).sub(p.center).multiplyScalar(grow).add(p.center); pos.setXYZ(i, _b.x, _b.y, _b.z); });
    pos.needsUpdate = true; p.hit.geometry.computeBoundingSphere();

    const hl = cur['hl_' + p.key];
    const show = hl > 0.004;
    p.hlTubes.visible = p.hlBalls.visible = show;
    if (show) {
      const rh = R * (1 + 0.32 * hl);
      for (let k = 0; k < 4; k++) { setTube(p.hlTubes, k, p.pts[k], p.pts[(k + 1) % 4], rh); setJoint(p.hlBalls, k, p.pts[k], rh); }
      p.hlTubes.instanceMatrix.needsUpdate = p.hlBalls.instanceMatrix.needsUpdate = true;
      p.hlMat.opacity = Math.min(1, hl * 1.2);
    }
    p.dot.position.copy(p.center);
    p.dot.scale.setScalar(0.075 * (1 + Math.sin(t * 2.4 + p.axis) * 0.18));
    p.dotMat.opacity = cur['dot_' + p.key];
    p.dot.visible = p.dotMat.opacity > 0.01;

    // label anchor rides on the live face
    const lb = cur['lb_' + p.key];
    p.anchor.visible = lb > 0.01;
    if (p.anchor.visible) {
      p.anchor.position.copy(p.center);
      p.anchor.quaternion.setFromRotationMatrix(_basis.makeBasis(p.u, p.v, p.normal));
      const side = Math.min(p.pts[0].distanceTo(p.pts[1]), p.pts[0].distanceTo(p.pts[3]));
      const s = side / 2;                                          // label scales with the face (designed for a 2-unit face)
      p.anchor.scale.setScalar(s);
      // white plate behind the name: from the top of the title to the bottom of the subline, with even padding
      const tb = p.titleText.textRenderInfo?.blockBounds, sb = p.subText.textRenderInfo?.blockBounds;
      const PAD = 0.13;
      const w = Math.max(tb ? tb[2] - tb[0] : 1.2, sb ? sb[2] - sb[0] : 0.6);
      const top = p.titleText.position.y + (tb ? tb[3] - tb[1] : 0.25) + PAD;
      const bottom = p.subText.position.y - (sb ? sb[3] - sb[1] : 0.11) - PAD;
      p.plate.scale.set(w + PAD * 2.4, top - bottom, 1);
      p.plate.position.y = (top + bottom) / 2;
      p.plateMat.opacity = 0.9 * lb;
      p.titleText.fillOpacity = p.subText.fillOpacity = lb;
    }
  }
}

function applyMaterials() {
  for (let b = 0; b < 4; b++) {
    const m = tubes[b].material, o = cur['op' + b];
    const opaque = o > 0.995;
    if (m.transparent === opaque) { m.transparent = !opaque; m.depthWrite = opaque; m.needsUpdate = true; }
    m.opacity = opaque ? 1 : Math.max(0, o);
    tubes[b].renderOrder = opaque ? 2 : 1;
  }
  jointMat.color.setRGB(cur.jr, cur.jg, cur.jb);
}

/* ---------------- turning a face to the viewer ---------------- */
const HOME = { yaw: -0.42, pitch: 0.2, dist: 15.9 };   // ~15% smaller on screen than 13.5
const qCube = new THREE.Quaternion(), qGoal = new THREE.Quaternion();
const restPts = [0, 1, 2, 3].map(() => new THREE.Vector3());
const restC = new THREE.Vector3(), restN = new THREE.Vector3(), restU = new THREE.Vector3(), restV = new THREE.Vector3();
const camDir = new THREE.Vector3(), camRight = new THREE.Vector3(), camUp = new THREE.Vector3(), tgt = new THREE.Vector3();
const _M1 = new THREE.Matrix4(), _M2 = new THREE.Matrix4();

function frameDistance(size, fill) {
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  return Math.max(size / (2 * t * fill), size / (2 * t * camera.aspect * fill));
}
// Rotate the cube so the face's outer side looks straight at the camera (its x/y on the screen's x/y),
// and move the camera in to frame it, keeping the direction the visitor orbited to.
function turnTo(p, smooth = true) {
  faceFor({ yz: 0, xw: 0, zw: 0, ...p.rest }, p, restPts, restC, restN, restU, restV, false);
  controls.getPosition(camDir); controls.getTarget(tgt);
  camDir.sub(tgt).normalize();
  camera.updateMatrixWorld();
  camUp.setFromMatrixColumn(camera.matrixWorld, 1);
  camRight.crossVectors(camUp, camDir).normalize(); camUp.crossVectors(camDir, camRight).normalize();
  _M1.makeBasis(camRight, camUp, camDir);                // where the face's axes should end up (world)
  _M2.makeBasis(restU, restV, restN);                    // the face's axes in the cube
  qGoal.setFromRotationMatrix(_M1.multiply(_M2.transpose()));
  const c = restC.clone().applyQuaternion(qGoal);        // face centre after the turn
  const size = Math.max(restPts[0].distanceTo(restPts[1]), restPts[0].distanceTo(restPts[3])) * 1.35;
  const dist = frameDistance(size, 0.54);
  controls.setLookAt(c.x + camDir.x * dist, c.y + camDir.y * dist, c.z + camDir.z * dist, c.x, c.y, c.z, smooth && !reduceMotion);
}
function goHome(smooth = true) {
  qGoal.identity();
  controls.moveTo(0, 0, 0, smooth && !reduceMotion);
  controls.dollyTo(HOME.dist, smooth && !reduceMotion);
}
const wrapPi = a => ((((a + Math.PI) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2)) - Math.PI;
const nearest = (from, target) => from - wrapPi(from - target);

/* ---------------- engage / disengage ---------------- */
const hint = document.getElementById('hint');
const pillsEl = document.getElementById('pills');
let leaving = null, engagedAt = -1, now = 0, introDone = false;

function setJointGoal(col) { goal.jr = col.r; goal.jg = col.g; goal.jb = col.b; }
function engage(p) {
  if (active === p) return;
  active = p; engagedAt = now;
  goal.speed = 0;
  const rest = { yz: 0, xw: 0, zw: 0, ...p.rest };
  ANGLE_KEYS.forEach(k => (goal[k] = nearest(cur[k], rest[k])));       // the face becomes a true square (through the 4th dimension)
  turnTo(p);                                                            // and turns its outer side to the viewer
  for (let b = 0; b < 4; b++) goal['op' + b] = b === p.axis ? 1 : DIM;
  PORTALS.forEach(q => { goal['hl_' + q.key] = q === p ? 1 : 0; goal['dot_' + q.key] = 0; goal['lb_' + q.key] = 0; });
  setJointGoal(p.color);
  hint.classList.add('hide');
  PORTALS.forEach(q => q.pill.classList.toggle('on', q === p)); pillsEl.classList.add('has-on');
}
function disengage() {
  if (!active || leaving) return;
  if (document.activeElement === active.link) active.link.blur();
  active = null;
  goal.yz = nearest(cur.yz, 0); goal.xw = nearest(cur.xw, 0);
  goHome();
  goal.speed = reduceMotion ? 0 : 1;
  for (let b = 0; b < 4; b++) goal['op' + b] = 1;
  PORTALS.forEach(q => { goal['hl_' + q.key] = 0; goal['dot_' + q.key] = 1; goal['lb_' + q.key] = 0; });
  setJointGoal(AXIS_COLORS[0]);
  hint.classList.remove('hide');
  PORTALS.forEach(q => q.pill.classList.remove('on', 'go')); pillsEl.classList.remove('has-on');
}

/* ---------------- input ---------------- */
const pointer = new THREE.Vector2(9, 9);
let pointerIn = false, overPill = false, orbiting = false;
const raycaster = new THREE.Raycaster();
const press = { on: false, moved: false, x: 0, y: 0 };
let pending = null, pendingAt = 0, leaveAt = -1;

controls.addEventListener('controlstart', () => { orbiting = true; });
controls.addEventListener('controlend', () => { orbiting = false; });

function setPointer(e) {
  const r = stage.getBoundingClientRect();
  pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  pointerIn = true;
}
function hits() {
  if (!pointerIn) return [];
  raycaster.setFromCamera(pointer, camera);
  return raycaster.intersectObjects(hitTargets, false).map(i => i.object.userData.portal);
}
function hoverTick() {
  if (!introDone || press.moved || orbiting) return;
  const h = hits();
  if (!active) {
    const p = h[0] || null;
    stage.classList.toggle('over-portal', !!p);
    if (p !== pending) { pending = p; pendingAt = now; }
    else if (p && now - pendingAt > 0.07) engage(p);
    return;
  }
  if (now - engagedAt < 0.6 || window.__hc?.hold || leaving) return;  // let the cube finish turning first
  if (h.includes(active) || overPill) { leaveAt = -1; return; }
  if (h[0]) { engage(h[0]); leaveAt = -1; return; }
  if (leaveAt < 0) leaveAt = now;
  else if (now - leaveAt > 0.3) { leaveAt = -1; disengage(); }
}

stage.addEventListener('pointerdown', e => { setPointer(e); press.on = true; press.moved = false; press.x = e.clientX; press.y = e.clientY; });
stage.addEventListener('pointermove', e => {
  setPointer(e);
  if (press.on && !press.moved && Math.abs(e.clientX - press.x) + Math.abs(e.clientY - press.y) > 5) {
    press.moved = true; stage.classList.add('dragging'); pending = null;
    leaveAt = -1;                                                        // an open face stays open (highlight + name) while it is dragged round
  }
});
stage.addEventListener('pointerup', e => {
  setPointer(e); stage.classList.remove('dragging');
  const wasDrag = press.moved; press.on = false; press.moved = false;
  if (wasDrag) return;
  const h = hits();
  if (active && h.includes(active) && now - engagedAt > 0.3) { (window.top || window).location.href = active.link.href; return; }
  if (h[0]) { engage(h[0]); return; }                                    // touch: first tap opens the face
  if (active && !overPill) disengage();
});
stage.addEventListener('pointerleave', () => { if (!press.on) pointerIn = false; });

for (const p of PORTALS) {
  p.link.addEventListener('focus', () => engage(p));                    // keyboard: Tab through the three pages
  p.link.addEventListener('blur', () => setTimeout(() => { if (active === p && !document.activeElement?.matches('.label, .pill')) disengage(); }, 50));
}
function go(p) {
  if (leaving) return;
  const settled = active === p && now - engagedAt > 0.8;
  engage(p); leaving = p; p.pill.classList.add('go');
  setTimeout(() => { (window.top || window).location.href = p.pill.href; }, reduceMotion ? 0 : settled ? 260 : 1100);
}
for (const p of PORTALS) {
  p.pill.addEventListener('pointerenter', e => { overPill = true; leaveAt = -1; if (e.pointerType === 'mouse' && introDone) engage(p); });
  p.pill.addEventListener('pointerleave', () => { overPill = false; });
  p.pill.addEventListener('focus', () => { if (!leaving) engage(p); });
  p.pill.addEventListener('blur', () => setTimeout(() => { if (active === p && !document.activeElement?.matches('.pill, .label')) disengage(); }, 50));
  p.pill.addEventListener('click', e => {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
    e.preventDefault(); go(p);
  });
}
addEventListener('pageshow', e => {
  if (!e.persisted) return;
  leaving = null; overPill = false; pointerIn = false; pending = null; leaveAt = -1;
  press.on = press.moved = false; stage.classList.remove('dragging', 'over-portal');
  if (document.activeElement?.matches('.pill, .label')) document.activeElement.blur();
  disengage();
  PORTALS.forEach(q => q.pill.classList.remove('go', 'on')); pillsEl.classList.remove('has-on');
  clock.getDelta();
});
addEventListener('keydown', e => { if (e.key === 'Escape') disengage(); });

/* ---------------- resize ---------------- */
function resize() {
  const w = innerWidth || stage.clientWidth || 1, h = innerHeight || stage.clientHeight || 1;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  HOME.dist = 15.9 * Math.max(1, 0.8 / (camera.aspect || 1));      // keep the cube in frame on portrait screens
  controls.maxDistance = Math.max(24, HOME.dist * 1.6);
  camera.updateProjectionMatrix();
  if (active) turnTo(active, false); else if (introDone) controls.dollyTo(HOME.dist, false);
}
addEventListener('resize', resize);
resize();
controls.setLookAt(0, 0, HOME.dist, 0, 0, 0, false);                  // intro starts head-on: the flat logo
controls.update(0);

/* ---------------- loop ---------------- */
let introStarted = false;
function tick(dt, t) {
  now = t;
  if (!introStarted && t > 0.7) {                                       // hold the flat logo, then unfold into the hypercube
    introStarted = true;
    controls.smoothTime = 1.1;
    const y = HOME.yaw, pt = HOME.pitch, d = HOME.dist;
    if (!active) controls.setLookAt(Math.sin(y) * Math.cos(pt) * d, Math.sin(pt) * d, Math.cos(y) * Math.cos(pt) * d, 0, 0, 0, !reduceMotion);
    goal.speed = reduceMotion ? 0 : 1; PORTALS.forEach(q => (goal['dot_' + q.key] = active ? 0 : 1));
  }
  if (!introDone && t > 2.6) { introDone = true; controls.smoothTime = 0.42; }

  // idle: drift through the 4th dimension and orbit slowly, unless the visitor is steering
  goal.zw += dt * 0.16 * cur.speed;
  if (introDone && !active && !orbiting && !press.on && cur.speed > 0.01) controls.rotate(dt * 0.06 * cur.speed, 0, false);

  ANGLE_KEYS.forEach(k => spring(k, OMEGA.ang, dt));
  spring('speed', OMEGA.speed, dt);
  for (let b = 0; b < 4; b++) spring('op' + b, OMEGA.op, dt);
  PORTALS.forEach(p => { spring('hl_' + p.key, OMEGA.hl, dt); spring('dot_' + p.key, OMEGA.hl, dt); spring('lb_' + p.key, OMEGA.label, dt); });
  ['jr', 'jg', 'jb'].forEach(k => spring(k, OMEGA.joint, dt));
  wobble = Math.sin(t * 0.11) * 0.2 * cur.speed;

  // the cube turns (slerp toward its goal orientation), the camera follows camera-controls
  qCube.slerp(qGoal, 1 - Math.exp(-OMEGA.turn * dt));
  group.quaternion.copy(qCube);
  controls.update(dt);
  group.updateMatrixWorld();
  camera.updateMatrixWorld();

  // the label fades in once the face has mostly turned to the viewer
  if (active && now - engagedAt > 0.45) goal['lb_' + active.key] = 1;

  camLocal.copy(camera.position); group.worldToLocal(camLocal);       // joints face the camera
  updateGeometry(t);
  applyMaterials();
  controls.getTarget(tgt);
  const camDist = camera.position.distanceTo(tgt);
  scene.fog.near = camDist - 0.5; scene.fog.far = camDist + 9;

  hoverTick();
  renderer.render(scene, camera);
}

const clock = new THREE.Clock();
let simT = 0, stepped = false;
function frame() { if (stepped) return; tick(Math.min(clock.getDelta(), 1 / 20), clock.elapsedTime); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
function advance(sec) { stepped = true; for (let i = 0; i < Math.round(sec * 60); i++) { simT += 1 / 60; tick(1 / 60, simT); } }

window.__hc = { engage: k => engage(PORTALS.find(p => p.key === k)), disengage, advance, cur, goal, PORTALS, camera, group, controls, P,
  hover: (x, y) => stage.dispatchEvent(new PointerEvent('pointermove', { clientX: x, clientY: y, bubbles: true })),
  screenOf: k => { const p = PORTALS.find(q => q.key === k); const v = p.center.clone().applyMatrix4(group.matrixWorld).project(camera); return [(v.x * .5 + .5) * innerWidth, (-v.y * .5 + .5) * innerHeight]; },
  facing: k => { const p = PORTALS.find(q => q.key === k); const n = p.normal.clone().transformDirection(group.matrixWorld); const c = p.center.clone().applyMatrix4(group.matrixWorld); return n.dot(camera.position.clone().sub(c).normalize()); } };
</script>
</body>
